name: ci
on: [push, pull_request]
jobs:
  mcp-server:
    # 주 사용 환경이 Windows라서 Windows에서도 돌린다(npm.cmd 실행 같은 플랫폼 문제를 잡기 위해)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci # postinstall이 shared 패키지를 빌드한다
      - run: npm run typecheck -w @envscout/shared -w envscout-mcp
      - run: npm test -w @envscout/shared
      # 샌드박스 격리 테스트용 이미지. Windows runner는 Windows 컨테이너 모드라 테스트가 스스로 건너뛴다.
      - if: runner.os == 'Linux'
        run: docker pull node:22-alpine
      - run: npm test -w envscout-mcp
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # 통합 테스트가 실제 MCP 서버를 띄우므로 먼저 빌드한다
      - run: npm run build -w envscout-mcp
      - run: npm run lint
      - run: npm run typecheck -w web
      - run: npm test -w web
      - run: npm run build -w web
